[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tender"
version = "0.2.0"
description = "Evidence-driven, auditable tender discovery and extraction for renewable-energy opportunities"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Wsang0825" }]
requires-python = ">=3.12,<3.13"
keywords = ["tender", "procurement", "renewable-energy", "document-parsing", "web-scraping", "evidence", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Office/Business",
]
dependencies = [
    "scrapling[fetchers]",
    "crawl4ai",
    "ddgs",
    # 1.28.x + pymupdf-layout cannot load on this host's current page-file budget.
    "pymupdf==1.27.2",
    "pymupdf4llm==0.3.4",
    "python-docx",
    "openpyxl",
    "pandas",
    "xlsxwriter",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "rapidfuzz",
    "diskcache",
    "dateparser",
    "python-dateutil",
    "tenacity",
    "httpx",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pyyaml",
    "orjson",
    "selectolax",
    "charset-normalizer",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "aiofiles",
    "typer",
    "rich",
    "loguru",
]

[project.scripts]
tender-ai = "tender_ai.cli.main:app"

[project.urls]
Repository = "https://github.com/Wsang0825/AI-Tender"
Issues = "https://github.com/Wsang0825/AI-Tender/issues"
Documentation = "https://github.com/Wsang0825/AI-Tender#readme"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
drissionpage = ["DrissionPage"]
mineru = ["mineru[all]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
